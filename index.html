<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Subxt vs PAPI Light Client</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
      .header { display: flex; gap: 1rem; padding: 0.5rem 1rem; }
      .header h2 { flex: 1; text-align: center; color: #e94560; font-size: 0.9rem; }
      .frames { display: flex; flex: 1; gap: 2px; }
      iframe { flex: 1; border: none; background: #1a1a2e; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Subxt Light Client</h2>
      <h2>Subxt RPC</h2>
      <h2>PAPI Light Client</h2>
    </div>
    <div class="frames">
      <iframe src="subxt.html"></iframe>
      <iframe src="subxt.html#rpc=wss://polkadot-asset-hub-rpc.polkadot.io:443"></iframe>
      <iframe id="papi" src="about:blank"></iframe>
    </div>
    <script>
      // Start PAPI after subxt LC gets its first block, so their smoldots don't compete
      const subxtFrame = document.querySelector("iframe[src='subxt.html']");
      const poll = setInterval(() => {
        try {
          if (subxtFrame.contentWindow._lastBlockTime != null) {
            clearInterval(poll);
            document.getElementById("papi").src = "papi.html";
          }
        } catch(e) {} // cross-origin check may throw
      }, 500);
      // Fallback: load after 20s regardless
      setTimeout(() => { clearInterval(poll); document.getElementById("papi").src = "papi.html"; }, 20000);
    </script>
  </body>
</html>
