<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PAPI + WASM Provider - Asset Hub</title>
    <style>
      body { font-family: monospace; margin: 2rem; background: #1a1a2e; color: #e0e0e0; }
      h1 { color: #e94560; }
      .status { color: #888; font-size: 0.85rem; }
      .mode-links { font-size: 0.85rem; margin-bottom: 1rem; }
      .mode-links a { color: #0fbcf9; text-decoration: none; }
      .mode-links a:hover { text-decoration: underline; }
      .mode-links a.active { color: #e94560; font-weight: bold; pointer-events: none; }
      .account-info { background: #16213e; padding: 1rem; border-radius: 4px; margin: 1rem 0; font-size: 0.85rem; }
      .account-info h3 { color: #e94560; margin: 0 0 0.5rem 0; font-size: 0.9rem; }
      .account-info .addr { color: #0fbcf9; word-break: break-all; }
      .account-info .field { margin: 0.3rem 0; }
      .account-info .label { color: #888; }
      .account-info .value { color: #e0e0e0; }
      ul { list-style: none; padding: 0; max-height: 50vh; overflow-y: auto; }
      li { padding: 0.3rem 0; border-bottom: 1px solid #333; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1 id="title">PAPI - Asset Hub</h1>
    <p class="mode-links">
      <a href="./" id="link-lc">WASM Light Client</a> |
      <a href="./?rpc=wss://polkadot-asset-hub-rpc.polkadot.io" id="link-rpc">WebSocket RPC</a>
    </p>
    <p id="status" class="status">Starting...</p>
    <p id="timer" class="status"></p>

    <div id="account" class="account-info" style="display:none">
      <h3>Account Balance (via PAPI)</h3>
      <div class="field"><span class="label">Address: </span><span class="addr" id="acct-addr"></span></div>
      <div class="field"><span class="label">Free: </span><span class="value" id="acct-free">...</span></div>
      <div class="field"><span class="label">Reserved: </span><span class="value" id="acct-reserved">...</span></div>
      <div class="field"><span class="label">Frozen: </span><span class="value" id="acct-frozen">...</span></div>
      <div class="field"><span class="label">Nonce: </span><span class="value" id="acct-nonce">...</span></div>
    </div>

    <ul id="blocks"></ul>

    <script>
      const isRpc = new URLSearchParams(location.search).has("rpc");
      document.getElementById(isRpc ? "link-rpc" : "link-lc").classList.add("active");

      setInterval(() => {
        if (window._lastBlockTime == null) return;
        const ago = ((performance.now() - window._lastBlockTime) / 1000).toFixed(1);
        document.getElementById("timer").textContent = `${ago}s since last block`;
      }, 100);
    </script>
    <script type="module" src="app-bundle.js"></script>
  </body>
</html>
